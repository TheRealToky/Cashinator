name: cashinator
description: Touch-first offline point-of-sale for a pastry shop, targeting the Samsung Tab S9.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Local persistence. No network stack anywhere in this app by design.
  sqflite: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.4

  # Dependency injection and change notification.
  provider: ^6.1.2

  # PIN hashing.
  crypto: ^3.0.5

  # Excel export. Chosen over `excel` for real formula support, which the
  # legacy Day Summary TOTAL row requires.
  syncfusion_flutter_xlsio: ^30.1.37

  # Used to post-process the saved workbook: xlsio writes a non-standard
  # leading '=' inside the OOXML <f> element, which openpyxl-based readers see
  # doubled. See ExcelExporter._normaliseFormulaBytes.
  archive: ^4.0.0

  # System share sheet (WhatsApp, Xender, etc.) for exported files.
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Runs the real schema in tests without a device or emulator.
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
