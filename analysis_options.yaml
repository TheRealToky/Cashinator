include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - unawaited_futures
    - use_super_parameters

analyzer:
  errors:
    # Off: it fires where a named parameter is assigned to a private field, but
    # Dart forbids named parameters that start with an underscore, so the
    # suggested initializing-formal rewrite does not compile. Constructor
    # injection of repositories (state/, export/) hits this deliberately.
    prefer_initializing_formals: ignore
  exclude:
    - build/**
    - android/**
    - windows/**
