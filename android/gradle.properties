org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.io.tmpdir=D:/gtmp -Djdk.net.unixdomain.tmpdir=D:/gtmp
# JDK 21's java.nio.channels.Pipe (used by Gradle's inter-process messaging)
# opens an AF_UNIX socket under java.io.tmpdir. The machine's default TEMP path
# contains a space ("PC DISAINE"), which makes the AF_UNIX connect fail with
# "Unable to establish loopback connection". Redirecting to a short, space-free
# directory fixes it. The build also runs with JAVA_TOOL_OPTIONS set to the same
# tmpdir so the Gradle launcher JVM (which forks the daemon) is covered too.
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
